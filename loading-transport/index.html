  <style>
    :root {
      color-scheme: dark;
      --page-bg: #01070e;
      --focus: #f4b83f;
    }

    * { box-sizing: border-box; }

    html {
      width: 100%;
      margin: 0;
      background: var(--page-bg);
      scroll-behavior: smooth;
      scrollbar-color: #b9862e #06111e;
    }

    body {
      width: 100%;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      background: var(--page-bg);

    .reference-page {

      margin: 0 auto;
      overflow: hidden;

      line-height: 0;
    }

    .reference-art {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      user-select: none;
      -webkit-user-drag: none;
    }

    .section-anchor {
      position: absolute;
      right: 0;
      left: 0;
      height: 1px;
      pointer-events: none;
      scroll-margin-top: 12px;
    }

    .hotspot {
      position: absolute;
      z-index: 2;
      display: block;
      overflow: hidden;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: transparent;
      font-size: 0;
      line-height: 0;
      text-indent: -9999px;
      cursor: pointer;
    }

    .hotspot:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
      background: rgba(244, 184, 63, .10);
    }

    .logo-hotspot { top: .48%; left: 3.1%; width: 15%; height: 1.45%; }

    .price-quote-hotspot { top: 45.82%; left: 59.1%; width: 35.4%; height: 1.15%; }
    .contact-hotspot { top: 88.23%; left: 7.1%; width: 42.7%; height: 1.18%; }

    .sr-only {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }
